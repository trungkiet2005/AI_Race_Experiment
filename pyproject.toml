[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-race-llm"
version = "0.2.0"
description = "Repeated idealised AI race experiments with LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
analysis = [
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.5,<2",
]
dev = [
  "pytest>=8,<9",
]
strategy-ml = [
  "tensorflow>=2.16,<3",
  "scikit-learn>=1.5,<2",
  "imbalanced-learn>=0.12,<1",
]
activation-xai = [
  "torch>=2.4,<3",
  "transformers>=4.48,<5",
  "transformer-lens==2.11.0",
  "sae-lens==5.3.3",
  "huggingface-hub>=0.27,<2",
  "scikit-learn>=1.5,<2",
]
api = [
  "anthropic>=0.39",
  "mistralai>=1.0",
  "openai>=1.40",
  "python-dotenv>=1.0",
]
kaggle-benchmark = [
  "kaggle>=1.7",
  "kaggle-benchmarks",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["ai_race*", "FAIRGAME*"]
exclude = ["FAIRGAME.unit_tests*"]

[tool.setuptools.package-data]
ai_race = [
  "configs/**/*.json",
  "prompts/*.txt",
  "xai/presets/*.json",
]
FAIRGAME = [
  "LICENSE",
  "NOTICE.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ai_race/tests"]
addopts = "-q"
